<!DOCTYPE html>

  <script src="script.js"></script>
<style>
  .favorite-icon {
  width: 18px !important; /* 強制縮小 */ 
  height: 18px !important; 
  position: absolute;
  bottom: 70px; /* 右上角 */
  right: 15px; 
  cursor: pointer;
  transition: transform 0.2s;
}
.favorite-icon:hover {
  transform: scale(1.3);
}
.favorite-icon.active {
  filter: invert(27%) sepia(94%) saturate(7468%) hue-rotate(357deg);
}
  #backToTop {
    position: fixed;
    bottom: 40px;
    right: 40px;
    z-index: 1000;
    background-color: #333;
    color: #fff;
    border: none;
    padding: 12px 16px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: none; /* 一開始隱藏 */
    transition: background 0.3s, transform 0.2s;
  }
  
  #backToTop:hover {
    background-color: #555;
    transform: scale(1.1);
  }

</style>
</head>

<script src="js/cart.js"></script>

<!-- 上裝商品區 -->

  <h2>上裝 tops</h2>

      <img src="images/heart.png" class="favorite-icon" onclick="toggleFavorite(this)" alt="收藏">

      </a>
      <img src="images/heart.png" class="favorite-icon" onclick="toggleFavorite(this)" alt="收藏">
      <button class="add-cart-btn" onclick="addToCart(this)">
        加入購物車
      </button>
    </div>

    <!-- 商品 4 -->
    <div class="product" data-id="13" data-name="歐美紫色西裝外套" data-price="1190" data-img="images/13.jpg">
      <a href="product.html?id=13" class="product-link">
        <img src="images/13.jpg" alt="歐美紫色西裝外套">
        <h3 class="product-name">歐美紫色西裝外套</h3>

<!-- Footer -->
<footer>

</footer>


<script>
  // 商品頁收藏切換
  window.toggleFavorite = function(el) {
    const product = el.closest(".product");
    const id = product.dataset.id;
    const name = product.dataset.name;
    const price = product.dataset.price;
    const img = product.dataset.img;
  
    if (!id || !name || !price || !img) return;
  
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    const index = favorites.findIndex(item => item.id === id);
  
    if (el.src.includes("heart.png")) {
      el.src = "images/love.png"; // 切換成已收藏圖
      if (index === -1) {
        favorites.push({ id, name, price, img });
      }
    } else {
      el.src = "images/heart.png"; // 切換回未收藏
      if (index !== -1) favorites.splice(index, 1);
    }
  
    localStorage.setItem("favorites", JSON.stringify(favorites));
  };
  function addToCart(button) {
    const product = button.closest('.product');
    const id = product.dataset.id;
    const name = product.dataset.name;
    const price = parseInt(product.dataset.price);
    const img = product.dataset.img;

    if (!id || !name || !price || !img) return;

    // 取出購物車
    let cart = JSON.parse(localStorage.getItem("cart")) || {};

    // 如果商品已存在就 +1
    if (cart[id]) {
        cart[id].quantity += 1;
    } else {
        cart[id] = { id, name, price, img, quantity: 1 };
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    // 顯示提示框
    alert(`${name} 已加入購物車！`);
}

  </script>
      <!-- 回到頂部按鈕 -->
    <button id="backToTop" title="回到頂部">↑</button>
</body>
