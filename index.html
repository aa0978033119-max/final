<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STANDARD DAY Clothing Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-left">
      <a href="index.html" class="logo">STANDARD DAY</a>
    </div>
  
    <div class="nav-icons">
      <div class="search-wrapper">
        <img src="images/search.png" alt="Search" id="searchIcon">
        <div class="search-box" id="searchBox">
          <div class="search-input">
            <img src="images/search.png" alt="">
            <input type="text" id="searchInput" placeholder="搜尋商品...">
            <div class="search-result" id="searchResult"></div>
          </div>
        </div>
      </div>
  
      <div class="menu-wrapper">
        <img src="images/clothes.png" alt="Browse" id="menuIcon">
        <div class="menu-box" id="menuBox">
          <a href="tops.html" class="menu-item">
            <img src="images/tops.png" alt="Tops">
          </a>
          <a href="bottoms.html" class="menu-item">
            <img src="images/bottoms.png" alt="Bottoms">
          </a>
        </div>
      </div>
  
      <a href="about.html" title="關於我們">
        <img src="images/info.png" alt="About">
      </a>
  
      <div id="user-area">
        <a href="member.html">
          <img src="images/user.png" title="註冊 / 登入">
        </a>
      </div>

      <a href="cart.html" title="購物車" id="cartLink">
        <img src="images/shopping_cart.png" alt="Cart">
      </a>
    </div>
  </header>

  <!-- Banner -->
  <section class="banner mySlides">
    <img id="bannerImage" src="images/banner1.jpg" alt="Banner">
    <div class="banner-text">
      <h1 id="bannerTitle">NEW ARRIVAL</h1>
      <p id="bannerDesc">秋冬新品 8 折起</p>
      <button>立即選購</button>
    </div>
    <button class="prev" onclick="prevBanner()">❮</button>
    <button class="next" onclick="nextBanner()">❯</button>
    <div class="dots" id="dotsContainer"></div>
  </section>

  <!-- 商品區 -->
  <section class="products">
    <h2>熱門商品</h2>
    <div class="product-grid">

      <div class="product" data-id="1" data-name="夢幻粉色大衣" data-price="1280" data-img="images/01.jpg">
        <a href="product.html?id=1" class="product-link">
          <img src="images/01.jpg" alt="夢幻粉色大衣">
          <h3 class="product-name">夢幻粉色大衣</h3>
          <div class="product-price">NT$1,280</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

      <div class="product" data-id="2" data-name="質感黑色牛仔夾克" data-price="1280" data-img="images/02.jpg">
        <a href="product.html?id=2" class="product-link">
          <img src="images/02.jpg" alt="質感黑色牛仔夾克">
          <h3 class="product-name">質感黑色牛仔夾克</h3>
          <div class="product-price">NT$1,280</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

      <div class="product" data-id="3" data-name="象牙白打底上衣" data-price="690" data-img="images/03.jpg">
        <a href="product.html?id=3" class="product-link">
          <img src="images/03.jpg" alt="象牙白打底上衣">
          <h3 class="product-name">象牙白打底上衣</h3>
          <div class="product-price">NT$690</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

    </div>

    <h2>上裝</h2>
    <div class="product-grid">

      <div class="product" data-id="4" data-name="紅色針織毛衣" data-price="780" data-img="images/04.jpg">
        <a href="product.html?id=4" class="product-link">
          <img src="images/04.jpg" alt="紅色針織毛衣">
          <h3 class="product-name">紅色針織毛衣</h3>
          <div class="product-price">NT$780</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

      <div class="product" data-id="5" data-name="藍色條紋襯衫" data-price="850" data-img="images/05.jpg">
        <a href="product.html?id=5" class="product-link">
          <img src="images/05.jpg" alt="藍色條紋襯衫">
          <h3 class="product-name">藍色條紋襯衫</h3>
          <div class="product-price">NT$850</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

      <div class="product" data-id="6" data-name="黑色皮革外套" data-price="1580" data-img="images/06.jpg">
        <a href="product.html?id=6" class="product-link">
          <img src="images/06.jpg" alt="黑色皮革外套">
          <h3 class="product-name">黑色皮革外套</h3>
          <div class="product-price">NT$1,580</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

    </div>

    <h2>下裝</h2>
    <div class="product-grid">

      <div class="product" data-id="7" data-name="淺色牛仔褲" data-price="990" data-img="images/07.jpg">
        <a href="product.html?id=7" class="product-link">
          <img src="images/07.jpg" alt="淺色牛仔褲">
          <h3 class="product-name">淺色牛仔褲</h3>
          <div class="product-price">NT$990</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

      <div class="product" data-id="8" data-name="灰色運動長褲" data-price="880" data-img="images/08.jpg">
        <a href="product.html?id=8" class="product-link">
          <img src="images/08.jpg" alt="灰色運動長褲">
          <h3 class="product-name">灰色運動長褲</h3>
          <div class="product-price">NT$880</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

      <div class="product" data-id="9" data-name="卡其休閒短褲" data-price="680" data-img="images/09.jpg">
        <a href="product.html?id=9" class="product-link">
          <img src="images/09.jpg" alt="卡其休閒短褲">
          <h3 class="product-name">卡其休閒短褲</h3>
          <div class="product-price">NT$680</div>
        </a>
        <img src="images/heart.png" class="favorite-icon" alt="收藏">
        <button class="add-cart-btn">加入購物車</button>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>聯絡我們｜service@standardday.com</p>
    <p>© 2025 STANDARD DAY. All rights reserved.</p>
  </footer>

  <!-- 回到頂部 -->
  <button id="backToTop" title="回到頂部">↑</button>

  <!-- JS -->
  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
