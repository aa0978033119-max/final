<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>

  <!-- Header / Navbar（共用） -->
  <header>
    <div class="nav-left">
      <a href="index.html" class="logo">STANDARD DAY</a>
    </div>

    <div class="nav-icons">
      <div class="search-wrapper">
        <img src="images/search.png" alt="Search">
      </div>
      <div class="menu-wrapper">
        <img src="images/clothes.png" alt="Browse">
        <div class="menu-box">
          <a href="tops.html">上裝</a>
          <a href="bottoms.html">下裝</a>
        </div>
      </div>
      <a href="about.html" title="關於我們">
        <img src="images/info.png" alt="About">
      </a>
      <a href="member.html" title="會員中心">
        <img src="images/user.png" alt="Member">
      </a>
      <a href="cart.html" title="購物車">
        <img src="images/shopping_cart.png" alt="Cart">
      </a>
    </div>
  </header>

  <main class="product-container">
  <!-- 左：圖片 -->
  <div class="product-images">
    <img id="mainImage" src="" alt="商品圖片">
  </div>

  <!-- 右：資訊 -->
  <div class="product-info">
    <h1 id="productName"></h1>
    <p id="productDesc"></p>
    <p class="price" id="productPrice"></p>

    <label>
      尺寸選擇
      <select id="sizeSelect"></select>
    </label>

    <label>
      數量
      <input type="number" value="1" min="1">
    </label>

    <button class="add-cart">加入購物車</button>
  </div>
</main>

<!-- Tabs -->
<section class="tabs">
  <button class="tab active" data-tab="detail">商品描述</button>
  <button class="tab" data-tab="shipping">送貨及付款方式</button>
  <button class="tab" data-tab="review">顧客評價</button>
</section>

<section class="tab-content">
  <div id="detail" class="content active"></div>
  <div id="shipping" class="content">7-11 / 全家 / 信用卡 / Apple Pay</div>
  <div id="review" class="content">尚無評價</div>
</section>
  
<footer>
    <p>聯絡我們｜service@standardday.com</p>
    <p>© 2025 STANDARD DAY. All rights reserved.</p>
  </footer>
  
<script src="products.js"></script>
<script src="product.js"></script>
  
</body>
</html>
