<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結帳頁</title>
    <link rel="stylesheet" href="check.html">
</head>
<body>

<div class="checkout-container">
    <h2>結帳付款</h2>
    
    <form id="checkoutForm">
        <div class="section">
            <h3>收件人資訊</h3>
            <div class="form-group">
                <label for="name">收件人姓名</label>
                <input type="text" id="name" name="name" placeholder="請輸入完整姓名" required>
            </div>
            <div class="form-group">
                <label for="phone">電話</label>
                <input type="tel" id="phone" name="phone" placeholder="請輸入電話號碼" required>
            </div>
            <div class="form-group">
                <label for="address">地址</label>
                <input type="text" id="address" name="address" placeholder="請輸入完整地址" required>
            </div>
        </div>

        <div class="section">
            <h3>付款方式</h3>
            <div class="payment-options">
                <label class="payment-item">
                    <input type="radio" name="payment" value="credit_card" checked>
                    <span class="payment-text">信用卡 (線上支付)</span>
                </label>
                <label class="payment-item">
                    <input type="radio" name="payment" value="line_pay">
                    <span class="payment-text">LINE Pay</span>
                </label>
                <label class="payment-item">
                    <input type="radio" name="payment" value="convenience_store">
                    <span class="payment-text">超商取貨付款</span>
                </label>
            </div>
        </div>

        <div class="section summary">
            <h3>訂單摘要</h3>
            <div class="summary-item"><span>商品小計</span><span>$1,200</span></div>
            <div class="summary-item"><span>運費</span><span>$60</span></div>
            <hr>
            <div class="summary-item total"><span>總計</span><span>$1,260</span></div>
        </div>

        <button type="submit" id="submitBtn">確認送出訂單</button>
    </form>

    <div id="successMessage" class="hidden">
        <div class="success-content">
            <h2>訂單完成</h2>
            <p>感謝您的訂購，我們將盡快為您處理。</p>
            <button onclick="location.reload()">返回首頁</button>
        </div>
    </div>
</div>

<script src="check.js"></script>
</body>
</html>
